[project]
name = "space-paper"
version = "1.0.0"
description = "Give every macOS Space its own wallpaper and flash its name when you switch, so the active desktop is identifiable at a glance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pyobjc-framework-Cocoa>=10.0"]

[project.scripts]
spacepaper = "space_paper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_paper"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: renders through headless Chrome; slower, and needs Chrome installed",
]
