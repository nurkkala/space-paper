[project]
name = "space-paper"
version = "0.1.0"
description = "Give every macOS Space its own wallpaper, so the active desktop is identifiable at a glance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pyobjc-framework-Cocoa>=10.0"]

[project.scripts]
spacepaper = "space_paper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space_paper"]
